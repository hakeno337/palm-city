<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palm City — a tiny open-world crime spree</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%232196b8'/%3E%3Cpath d='M16 24 L17 12' stroke='%238a6b45' stroke-width='2.4'/%3E%3Cpath d='M17 12 Q8 6 5 12 M17 12 Q12 4 8 5 M17 12 Q17 3 21 4 M17 12 Q24 5 27 10 M17 12 Q26 10 28 15' stroke='%232f9e57' stroke-width='2.2' fill='none'/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1620; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Palm City: a top-down open-world crime game. Walk and drive with WASD or the arrow keys, press E to enter or exit a car, F to punch."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
